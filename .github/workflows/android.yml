name: TSI Bedrock Edition Native APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Bedrock Edition
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify C/C++ only app sources
        shell: bash
        run: |
          if find app/src/main -type f \( -name '*.kt' -o -name '*.java' \) | grep -q .; then
            echo "Unexpected Kotlin or Java application source found."
            exit 1
          fi
          test -f app/src/main/cpp/native-lib.cpp
          test -f app/src/main/cpp/CMakeLists.txt

      - name: Build Bedrock NativeActivity APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify both native Android ABIs
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtsi_bedrock.so"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/libtsi_bedrock.so"
          echo "Verified Conshite-style C++ NativeActivity launcher library for arm64-v8a and armeabi-v7a."

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: TSI-Launcher-Bedrock-native-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
